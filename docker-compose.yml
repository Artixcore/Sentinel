services:
  api:
    build: { context: ./apps/api }
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./apps/api:/var/www/html"]
    depends_on: [mysql, redis]
    command: php artisan serve --host=0.0.0.0 --port=8000
  worker:
    build: { context: ./apps/api }
    env_file: .env
    volumes: ["./apps/api:/var/www/html"]
    depends_on: [mysql, redis]
    command: php artisan queue:work --queue=monitoring,default --tries=3 --timeout=120
  scheduler:
    build: { context: ./apps/api }
    env_file: .env
    volumes: ["./apps/api:/var/www/html"]
    depends_on: [mysql, redis]
    command: php artisan schedule:work
  web:
    build: { context: ./apps/web }
    env_file: .env
    ports: ["3000:3000"]
    volumes: ["./apps/web:/app", "/app/node_modules"]
    depends_on: [api]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: sentinel, MYSQL_USER: sentinel, MYSQL_PASSWORD: sentinel, MYSQL_ROOT_PASSWORD: root }
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes: { mysql_data: {}, redis_data: {} }
